<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10151d" />
    <title>Magic game · Hand tracking</title>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Magic game / first experiment</p>
        <h1>Your hands are the controller.</h1>
        <p>Start your camera and hold one or both hands in view.</p>
      </header>

      <section class="tracker" aria-label="Hand tracking preview">
        <div class="preview">
          <video id="camera" autoplay muted playsinline aria-label="Mirrored webcam view"></video>
          <canvas id="landmarks" aria-hidden="true"></canvas>
          <p id="placeholder">Your camera preview will appear here.</p>
        </div>
        <div class="toolbar">
          <div class="buttons">
            <button id="start" type="button">Start camera</button>
            <button id="stop" type="button" disabled>Stop camera</button>
          </div>
          <span id="hand-count">0 hands detected</span>
        </div>
      </section>

      <p id="status" role="status" aria-live="polite">Ready when you are.</p>
      <p class="privacy">Camera frames are processed on this device. No video is uploaded.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
