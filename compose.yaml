services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-magic}
      POSTGRES_USER: ${POSTGRES_USER:-magic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magic}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["sh", "-c", "alembic upgrade head && uvicorn admit_hackathon.api.main:app --host 0.0.0.0 --port 8000"]
    environment:
      MAGIC_DATABASE_URL: ${MAGIC_DATABASE_URL:-postgresql+psycopg://magic:magic@postgres:5432/magic}
      MAGIC_JWT_SECRET: ${MAGIC_JWT_SECRET:-development-only-change-this-secret}
      MAGIC_CORS_ORIGINS: ${MAGIC_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
