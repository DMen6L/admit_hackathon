name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    env:
      MAGIC_DATABASE_URL: postgresql+psycopg://magic:magic@localhost:5432/magic
      MAGIC_JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: magic
          POSTGRES_USER: magic
          POSTGRES_PASSWORD: magic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magic -d magic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend and test dependencies
        run: python -m pip install ".[test]"

      - name: Check Python compilation
        run: python -m compileall -q src tests scripts

      - name: Validate database migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest
